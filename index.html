<style>
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(120px) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            to { transform: rotate(360deg) translateX(0px) rotate(-360deg); opacity: 0; }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px #b8c3ff) drop-shadow(0 0 10px #ffaedd); }
            50% { filter: drop-shadow(0 0 15px #b8c3ff) drop-shadow(0 0 30px #ffaedd); }
        }
        .scanning-bar {
            background: linear-gradient(to right, transparent, #b8c3ff, #ffaedd, #b8c3ff, transparent);
            height: 4px;
            width: 100%;
            position: absolute;
            z-index: 10;
            filter: blur(2px);
            animation: scanline 3s linear infinite;
        }
        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            animation: orbit 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .glass-blur {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

<script>
        const progressCircle = document.getElementById('progressCircle');
        const progressPercent = document.getElementById('progressPercent');
        const statusUpdate = document.getElementById('statusUpdate');
        const radius = progressCircle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        const setProgress = (percent) => {
            const offset = circumference - (percent / 100 * circumference);
            progressCircle.style.strokeDashoffset = offset;
            progressPercent.innerText = `${Math.round(percent)}%`;
        };

        const statuses = [
            "Initializing neural fashion core...",
            "Decoding fabric textures...",
            "Analyzing silhouette symmetry...",
            "Matching chromatic harmonies...",
            "Identifying accessory metadata...",
            "Referencing 2024 runway trends...",
            "Synthesizing style score...",
            "Finalizing your glam profile..."
        ];

        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 2;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                statusUpdate.innerText = "Analysis Complete!";
            }
            setProgress(progress);

            // Update status text based on progress
            const statusIdx = Math.floor((progress / 100) * statuses.length);
            if(statuses[statusIdx] && progress < 100) {
                statusUpdate.innerText = statuses[statusIdx];
            }
        }, 150);

        // Simple mouse interaction for depth effect
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            const container = document.querySelector('main > div:nth-child(2)');
            if(container) {
                container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
